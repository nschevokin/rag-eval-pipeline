[project]
name = "rag-eval-pipeline"
version = "0.1.0"
description = "Document question answering where every new search index must pass a measured evaluation gate before it serves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
models = [
    "sentence-transformers>=3.0",
]
generation = [
    "anthropic>=0.40",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]
known-local-folder = ["conftest", "helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs PostgreSQL with pgvector at RAG_TEST_DATABASE_URL",
]
addopts = "-ra"
